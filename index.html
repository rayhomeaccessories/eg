<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ===== Ray Home Accessories — v5 · root folders: كل فولدر منتج في الجذر الرئيسي جنب index.html ===== -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/fonts.css">
<title>Ray Home Accessories — 3D Printed Warmth for Every Home</title>
<meta name="description" content="Ray Home Accessories — 3D printed table lamps, pendent lamps, vases and planter pots, designed in-house and printed in New Cairo, Egypt. Free shipping on all orders.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{
  --cream:#FAF7F1; --cream-2:#F4EEE3; --paper:#FFFFFF;
  --ink:#211D18; --ink-soft:#6F675B; --ink-faint:#9A938A;
  --line:#E7DFD0; --line-soft:#F0E9DC;
  --terra:#BC5B33; --terra-soft:#D08655; --olive:#7A814F;
  --dark:#241D16; --dark-2:#2E261D;
  --gold:#C09300;
  --serif:'Cormorant Garamond','Georgia',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 4px 14px rgba(60,48,32,.08);
  --shadow:0 18px 46px rgba(60,48,32,.14);
  --shadow-lg:0 30px 70px rgba(36,29,22,.22);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
html[dir="rtl"]{
  --serif:'El Messiri','Cairo',serif;
  --sans:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
section[id]{scroll-margin-top:118px}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
img{display:block;max-width:100%}
button{font-family:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}
.container{max-width:1240px;margin:0 auto;padding:0 24px}

/* ---------- progress + announcement ---------- */
.progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--terra),var(--terra-soft));z-index:200;transition:opacity .3s}
body.xlocked .progress{opacity:0}
.ann{background:var(--dark);color:#EDE4D6;font-size:.7rem;letter-spacing:.05em;overflow:hidden;white-space:nowrap}
.ann-track{display:inline-flex;white-space:nowrap;animation:annMove 28s linear infinite;padding:9px 0}
.ann-track b{color:#F2D8C4}
@keyframes annMove{to{transform:translateX(-50%)}}
.top-stack{position:sticky;top:0;z-index:100}

/* ---------- header ---------- */
header.nav{position:relative;background:rgba(250,247,241,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s,background .3s}
header.nav.scrolled{border-color:var(--line);box-shadow:0 6px 24px rgba(60,48,32,.07)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:78px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.logo-emblem{width:48px;height:48px;border-radius:50%;flex:none}
.l-stack{display:flex;flex-direction:column;line-height:1.02}
.l1{font-family:'Poppins',var(--sans);font-size:1.5rem;font-weight:600;letter-spacing:.02em;line-height:1}
.l2{font-size:.42rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}
nav ul{display:flex;gap:26px;list-style:none}
nav a{text-decoration:none;color:var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.02em;position:relative;transition:color .2s;padding:6px 0}
nav a::after{content:'';position:absolute;inset-inline-start:0;bottom:0;width:0;height:2px;background:var(--terra);transition:width .25s}
nav a:hover{color:var(--terra)}
nav a:hover::after{width:100%}
.nav-icons{display:flex;align-items:center;gap:10px}
.lang-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:8px 14px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.lang-toggle:hover{border-color:var(--ink);box-shadow:var(--shadow-sm)}
.lang-toggle .flg{flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:border-color .2s,transform .2s}
.icon-btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cart-count{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--terra);color:#fff;font-size:.6rem;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}
.cart-count.show{display:flex}
.burger{display:none}
@media (max-width:920px){nav ul{display:none}.burger{display:grid}}

/* ---------- mobile menu ---------- */
.mobile-menu{position:fixed;inset:0;z-index:110;background:var(--cream);transform:translateX(100%);transition:transform .4s cubic-bezier(.22,.8,.3,1);display:flex;flex-direction:column;padding:18px 26px 30px;overflow-y:auto}
[dir="rtl"] .mobile-menu{transform:translateX(-100%)}
.mobile-menu.open{transform:none}
.mm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.mobile-menu ul{list-style:none;display:flex;flex-direction:column}
.mm-link{font-family:var(--serif);font-size:1.6rem;font-weight:600;text-decoration:none;color:var(--ink);display:block;padding:14px 0;border-bottom:1px solid var(--line);transition:color .2s}
.mm-link:hover{color:var(--terra)}
.mm-foot{margin-top:auto;padding-top:30px;font-size:.82rem;color:var(--ink-soft)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:76vh;display:flex;align-items:center;overflow:hidden}
.hero .h-img{position:absolute;inset:0;transform:scale(1.12)}
.hero .h-img img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,247,241,.97) 0%,rgba(250,247,241,.86) 34%,rgba(250,247,241,.25) 66%,rgba(250,247,241,.05) 100%)}
[dir="rtl"] .hero::after{background:linear-gradient(270deg,rgba(250,247,241,.97) 0%,rgba(250,247,241,.86) 34%,rgba(250,247,241,.25) 66%,rgba(250,247,241,.05) 100%)}
.hero-txt{position:relative;z-index:2;max-width:640px;padding:100px 0}
#heroTitle{font-family:var(--serif);font-size:clamp(2.6rem,5.2vw,4.1rem);font-weight:600;line-height:1.06;letter-spacing:-.01em}
#heroTitle em{font-style:italic;color:var(--terra)}
#heroSub{margin:20px 0 34px;font-size:.98rem;color:var(--ink-soft);max-width:520px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 28px;border-radius:44px;background:var(--ink);color:var(--cream);text-decoration:none;font-size:.82rem;font-weight:700;letter-spacing:.03em;border:1.5px solid var(--ink);cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(33,29,24,.25)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--cream)}
.btn.sale{background:var(--terra);color:#fff}
.btn.sale:hover{background:#a54a28}
/* ---------- in-page policy page ---------- */
.page-overlay{position:fixed;inset:0;z-index:150;background:var(--cream);display:none;overflow-y:auto}
.page-overlay.show{display:block}
.pol-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:rgba(250,247,241,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pol-title{font-family:var(--serif);font-size:1.2rem;color:var(--ink)}
.pol-back{width:38px;height:38px}
.pol-lang{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;background:none;border:none}
.pol-lang:hover{color:var(--terra)}
.pol-body{max-width:740px;margin:0 auto;padding:34px 22px 90px;color:var(--ink-soft);font-size:.95rem;line-height:1.8}
.pol-lead{font-size:1.08rem;color:var(--ink);line-height:1.7;margin-bottom:8px}
.pol-body h3{font-family:var(--serif);font-size:1.18rem;color:var(--ink);margin:30px 0 10px}
.pol-body p{margin:8px 0}
.pol-body ul{margin:8px 0 14px;padding-inline-start:22px}
.pol-body li{margin:6px 0}
.pol-body li::marker{color:var(--terra)}
.faq-more{display:block;margin:30px auto 0;background:var(--ink);color:var(--cream);border:none;border-radius:44px;padding:13px 24px;font-size:.85rem;cursor:pointer;transition:background .2s}
.faq-more:hover{background:var(--terra)}
/* ---------- in-page FAQ page (own look) ---------- */
.faq-page{background:linear-gradient(180deg,#F3ECDF 0%,var(--cream) 380px)}
.faq-wrap{max-width:660px;margin:0 auto;padding:46px 22px 90px}
.faq-head{text-align:center;margin-bottom:32px}
.faq-badge{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:var(--ink);color:#E3B655;display:grid;place-items:center;box-shadow:0 12px 26px rgba(33,29,24,.22)}
.faq-badge svg{width:30px;height:30px}
.faq-sub{margin:0 auto;max-width:440px;font-size:.92rem;color:var(--ink-soft);line-height:1.7}
.faq-item{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.faq-item.open{border-color:var(--ink);box-shadow:0 12px 26px rgba(33,29,24,.08)}
.faq-q{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:none;border:none;cursor:pointer;text-align:start;font-family:var(--sans);font-size:.94rem;font-weight:700;color:var(--ink);line-height:1.45}
.faq-num{flex:none;min-width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--cream);display:grid;place-items:center;font-family:var(--sans);font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--gold);transition:background .2s,border-color .2s,color .2s}
.faq-item.open .faq-num{background:var(--ink);border-color:var(--ink);color:#E3B655}
.faq-qt{flex:1}
.faq-ic{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-soft);transition:transform .3s,background .2s,border-color .2s,color .2s}
.faq-ic svg{width:13px;height:13px}
.faq-item.open .faq-ic{transform:rotate(45deg);background:var(--terra);border-color:var(--terra);color:#fff}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.22,.8,.3,1)}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a-in{overflow:hidden}
.faq-a-in p{margin:0;padding:2px 20px 18px;padding-inline-start:60px;font-size:.9rem;color:var(--ink-soft);line-height:1.75}
/* ---------- shop tabs (each category = its own tab) ---------- */
.shop-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 30px}
.shop-tab{border:1.5px solid var(--line);background:var(--paper);border-radius:44px;padding:11px 22px;font-family:var(--sans);font-size:.82rem;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);cursor:pointer;transition:border-color .2s,background .2s,color .2s,transform .2s}
.shop-tab:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}
.shop-tab.active{background:var(--ink);border-color:var(--ink);color:var(--cream)}


.pill{display:inline-block;border:1.5px solid rgba(250,247,241,.9);color:var(--cream);background:rgba(36,29,22,.22);padding:10px 20px;border-radius:30px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;transition:background .25s}
.pill:hover{background:rgba(36,29,22,.5)}

/* ---------- section heads ---------- */
.sec-head{text-align:center;margin-bottom:44px}
.sec-head .over{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:12px}
.sec-head h2{font-family:var(--serif);font-size:clamp(2rem,3.6vw,2.8rem);font-weight:600;letter-spacing:-.01em}
.sec-head .rule{width:58px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--terra),var(--terra-soft));margin:18px auto 0}

/* ---------- product grid / cards ---------- */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.pgrid.two{grid-template-columns:repeat(2,1fr);max-width:680px;margin:0 auto}
@media (max-width:1020px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.pgrid{grid-template-columns:repeat(2,1fr);gap:12px}}
/* compact cards on small screens */
@media (max-width:560px){
.card h4{font-size:.92rem;margin:10px 12px 2px}
.card .p-spec{font-size:.66rem;margin:0 12px 6px}
.card .price{margin:0 12px 8px}
.card .price .now{font-size:.95rem}
.card .price .old{font-size:.68rem}
.card .c-pick{padding:7px 9px;gap:7px}
.card .c-hex{display:none}
.card .c-arr{display:none}
.card .add-btn{margin:10px 12px 14px;padding:10px;font-size:.72rem}
.card .quickview{bottom:8px;inset-inline-end:8px}
}
.grid-foot{text-align:center;margin-top:34px;font-size:.8rem;color:var(--ink-soft)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.22,.8,.3,1),box-shadow .35s,border-color .35s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:transparent}
.thumb{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--cream-2)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.22,.8,.3,1)}
.card:hover .thumb img{transform:scale(1.055)}
.badge{position:absolute;top:14px;inset-inline-start:14px;z-index:2;background:var(--ink);color:var(--cream);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 13px;border-radius:20px;box-shadow:var(--shadow-sm)}
.badge.new{background:var(--olive)}
.badge.set{background:var(--terra)}
.quickview{position:absolute;bottom:14px;inset-inline-end:14px;z-index:2;background:rgba(250,247,241,.97);border:1px solid var(--line);color:var(--ink);font-size:.68rem;font-weight:700;padding:8px 16px;border-radius:20px;cursor:pointer;opacity:0;transform:translateY(8px);transition:.3s;box-shadow:var(--shadow-sm)}
.card:hover .quickview{opacity:1;transform:none}
.card h4{font-family:var(--serif);font-size:1.18rem;font-weight:700;margin:18px 20px 4px;line-height:1.3}
.p-spec{font-size:.72rem;color:var(--ink-soft);margin:0 20px 12px}
.price{margin:0 20px 14px;font-size:.95rem}
.price .old{text-decoration:line-through;color:var(--ink-faint);opacity:.75;margin-inline-end:14px;font-size:.85rem}
.price .now{color:var(--terra);font-weight:700}
.c-pick-row{padding:0 20px}
.c-pick{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--cream);border-radius:var(--r-sm);padding:10px 13px;font-size:.74rem;cursor:pointer;color:var(--ink);transition:border-color .2s,background .2s}
.c-pick:hover{border-color:var(--ink-soft);background:var(--cream-2)}
.c-dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.c-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-hex{color:var(--ink-faint);font-size:.66rem}
.c-arr{margin-inline-start:auto;color:var(--ink-faint);font-size:.66rem;white-space:nowrap}
.add-btn{margin:14px 20px 20px;padding:13px;border-radius:var(--r-sm);background:var(--ink);color:var(--cream);border:none;font-size:.76rem;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .2s,transform .2s}
.view-cart-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:44px;padding:13px 24px;font-size:.82rem;font-weight:800;cursor:pointer;transition:background .2s,transform .2s,color .2s;white-space:nowrap}
.view-cart-btn:hover{background:var(--ink);color:var(--cream);transform:translateY(-2px)}
.view-cart-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.add-btn:hover{background:var(--terra);transform:translateY(-1px)}

/* ---------- banners / tiles ---------- */
.banner{position:relative;display:block;overflow:hidden;min-width:0;margin-bottom:22px;border-radius:var(--r-lg);text-decoration:none;color:#fff}
.banner.tall{height:460px}
.banner.mid{height:380px}
.banner:last-child{margin-bottom:0}
.tri-row{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media (max-width:640px){.tri-row{grid-template-columns:1fr}}
.banner .b-img{position:absolute;inset:0;animation:kb 18s ease-in-out infinite alternate}
.banner .b-img img{width:100%;height:100%;object-fit:cover;transition:transform .9s ease}
.banner:hover .b-img img{transform:scale(1.06)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.b-txt{position:relative;z-index:2;margin-top:auto;padding:48px 44px 34px;background:linear-gradient(transparent,rgba(30,24,17,.68) 62%);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;height:100%}
.b-sub{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;opacity:.9;margin-bottom:9px}
.b-txt h3{font-family:var(--serif);font-size:1.8rem;font-weight:600;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:22px}
@media (max-width:1020px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;aspect-ratio:1/1;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);display:block;text-decoration:none}
.tile .b-img{position:absolute;inset:0;animation:kb 20s ease-in-out infinite alternate}
.tile .b-img img{width:100%;height:100%;object-fit:cover;transition:transform .75s ease}
.tile:hover .b-img img{transform:scale(1.07)}
.t-label{position:absolute;inset-inline-start:14px;bottom:14px;z-index:2;background:rgba(33,29,24,.78);color:var(--cream);font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:9px 16px;border-radius:20px;backdrop-filter:blur(4px)}

/* ---------- wcard ---------- */
.wcard{position:relative;overflow:hidden;min-height:460px;display:flex;flex-direction:column;border-radius:var(--r-lg)}
.wcard .b-img{position:absolute;inset:0;animation:kb 16s ease-in-out infinite alternate}
.wcard .b-img img{width:100%;height:100%;object-fit:cover;transition:transform .9s ease}
.wcard:hover .b-img img{transform:scale(1.05)}
.w-txt{position:relative;z-index:2;margin-top:auto;background:linear-gradient(transparent,rgba(30,24,17,.78) 46%);color:#fff;padding:80px 52px 42px}
.w-txt h3{font-family:var(--serif);font-size:2.1rem;font-weight:600}
.w-price{margin:8px 0 10px;font-weight:700;color:#F2D8C4;font-size:1.02rem}
.w-desc{font-size:.88rem;opacity:.88;max-width:560px;margin-bottom:22px}
.w-txt .btn{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.w-txt .btn:hover{background:#fff}
@media (max-width:640px){.w-txt{padding:64px 26px 30px}}

/* ---------- categories ---------- */
.cats{background:var(--paper)}
.cat-block{margin-top:48px}
.cat-block:first-of-type{margin-top:6px}
.cat-h{display:flex;align-items:center;gap:16px;font-size:1.05rem;font-weight:800;letter-spacing:.01em;margin-bottom:20px}
.cat-h::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- story / features ---------- */
.features{background:var(--cream-2);padding:88px 0}
.about-lead{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:start;max-width:900px;margin:0 auto 60px}
@media (max-width:640px){.about-lead{grid-template-columns:1fr;text-align:center;justify-items:center}}
.story-emblem{width:130px;height:130px;border-radius:50%}
.about-lead .over{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:12px}
.about-lead h2{font-family:var(--serif);font-size:clamp(1.9rem,3.2vw,2.6rem);font-weight:600;margin-bottom:8px}
.s-p{color:var(--ink-soft);font-size:.92rem;margin-top:14px}
.f-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1000px;margin:0 auto}

.a-name{font-family:var(--serif);font-weight:700;font-size:1.02rem}
.a-sub{font-size:.72rem;color:var(--ink-soft);margin-top:1px}
.a-close{margin-inline-start:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none;transition:background .2s}
.a-close:hover{background:rgba(188,91,51,.08)}
.a-close svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.a-log{padding:18px 16px 8px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:.86rem;line-height:1.6}
.msg.a{background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;align-self:flex-start}
.msg.u{background:linear-gradient(135deg,#BC5B33,#9E4523);color:#fff;border-radius:16px 16px 4px 16px;align-self:flex-end;font-weight:500}
.a-res{display:flex;flex-direction:column;gap:10px;max-width:92%;align-self:flex-start;width:100%}
.a-item{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px}
.a-item img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.a-it{display:flex;flex-direction:column;min-width:0;flex:1}
.a-it span{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-it b{color:var(--terra);font-size:.85rem}
.a-it s{color:var(--ink-soft);font-size:.7rem;margin-inline-start:5px}
.a-itb{display:flex;gap:6px;flex:none}
.a-view{font-size:.72rem;font-weight:600;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:40px;padding:7px 13px;cursor:pointer;transition:background .2s,color .2s}
.a-view:hover{background:var(--ink);color:var(--cream)}
.a-addb{font-size:.72rem;font-weight:600;border:none;background:var(--terra);color:#fff;border-radius:40px;padding:7px 13px;cursor:pointer;transition:filter .2s}
.a-addb:hover{filter:brightness(1.09)}
.a-opts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 16px}
.a-opt{font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:40px;padding:9px 15px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.a-opt:hover{border-color:var(--terra);color:var(--terra);background:rgba(188,91,51,.06)}
.a-fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#BC5B33,#8F3D1E);display:grid;place-items:center;cursor:pointer;z-index:85;box-shadow:0 14px 34px rgba(188,91,51,.45);transition:transform .25s}
.a-fab:hover{transform:scale(1.08)}
.a-fab svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:720px){.a-fab{right:16px;bottom:16px;width:54px;height:54px}}

/* ===== custom orders ===== */
.card.custom-card{border-style:dashed;border-color:rgba(188,91,51,.45);background:linear-gradient(180deg,var(--paper),rgba(188,91,51,.05))}
.cc-flag{position:absolute;top:12px;inset-inline-start:12px;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#C25B33,#8F3D1E);display:grid;place-items:center;box-shadow:0 6px 14px rgba(188,91,51,.35);z-index:2}
.cc-flag svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cst-box{background:var(--cream);border:1px solid var(--line);border-radius:22px;width:100%;max-width:780px;max-height:88vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 30px 80px rgba(28,24,19,.42);position:relative}
.cst-img{position:relative;min-height:320px;background:var(--cream-2)}
.cst-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cst-body{padding:34px 30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.cst-body .over{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--terra);font-weight:700}
.cst-body h3{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1.25;margin-bottom:2px}
.cst-body p{font-size:.88rem;color:var(--ink-soft);line-height:1.75}
.cst-steps{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.cst-step{display:flex;align-items:center;gap:10px;font-size:.84rem}
.cst-step span{width:26px;height:26px;border-radius:50%;background:rgba(188,91,51,.1);border:1px solid rgba(188,91,51,.3);color:var(--terra);display:grid;place-items:center;font-weight:700;font-size:.78rem;flex:none}
.cst-step b{font-weight:600}
.cst-body .btn{align-self:flex-start;margin-top:6px}
@media (max-width:720px){.cst-box{grid-template-columns:1fr;max-height:92vh;overflow-y:auto}.cst-img{min-height:200px}}

/* assistant v2: reasons + color line */
.a-reason{font-size:.7rem;color:var(--ink-soft);margin-top:2px}
.a-col{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);margin-top:3px}
.a-col i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block;flex:none}
.a-col em{font-style:normal;opacity:.7}
.a-pr{display:block;margin-top:4px}

/* custom card v2 */
.card.custom-card .thumb{cursor:pointer}
.card.custom-card .add-btn{background:linear-gradient(135deg,#C25B33,#8F3D1E);color:#fff}
.card.custom-card .add-btn:hover{filter:brightness(1.09);background:linear-gradient(135deg,#C25B33,#8F3D1E)}
</style>

<script>
/* IO fallback (kept minimal; native used in browsers) */
if (typeof IntersectionObserver === 'undefined') {
  window.IntersectionObserver = class {
    constructor(cb){ this.cb = cb || function(){}; }
    observe(el){ var self = this; setTimeout(function(){ self.cb([{ isIntersecting:true, target:el }]); }, 0); }
    unobserve(){}
    disconnect(){}
  };
}
</script>

async function smallImgFile(dataUri, id, maxDim){
  maxDim = maxDim || 560;
  try {
    const im = await new Promise((res, rej) => { const x = new Image(); x.onload = () => res(x); x.onerror = rej; x.src = dataUri; });
    const s = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(im, 0, 0, w, h);
    return await new Promise(res => cv.toBlob(b => res(b ? new File([b], id + '.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', 0.8));
  } catch (e) { return null; }
}
function waShare(msg, files){
  const payload = { text: msg };
  if (files && files.length && navigator.share) payload.files = files;
  const ok = (typeof navigator.canShare === 'function') ? navigator.canShare(payload) : false;
  if (ok) navigator.share(payload).catch(() => window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank'));
  else window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank');
}

  white:   { 'table-lamp-025':'Bone White','konio-lamp':'Bone White','pendant-lamp-007':'Bone White','pendant-lamp-008':'Bone White','chain-pendant-03':'Bone White','twisted-pendant':'Bone White','flower-vase-013':'Bone White','flower-vase-016':'Bone White','planter-pot-005':'Bone White','planter-pot-014':'Bone White' },
  dark:    { 'table-lamp-025':'Black','konio-lamp':'Black','pendant-lamp-007':'Black','pendant-lamp-008':'Black','chain-pendant-03':'Black','twisted-pendant':'Brown','flower-vase-013':'Black','flower-vase-016':'Brown','planter-pot-005':'Black','planter-pot-014':'Brown' },
  natural: { 'table-lamp-025':'Beige','konio-lamp':'Light Khaki','pendant-lamp-007':'Light Khaki','pendant-lamp-008':'Beige','chain-pendant-03':'Beige','twisted-pendant':'Light Khaki','flower-vase-013':'Light Khaki','flower-vase-016':'Beige','planter-pot-005':'Beige','planter-pot-014':'Light Khaki' }
};
const BUD_MID = { b1:400, b2:1100, b3:2000 };
const BUD_TOP = { b1:700, b2:1500, b3:Infinity };
const BUDMAP = { b1:['planter-pot-005','planter-pot-014'], b2:['planter-pot-005','planter-pot-014','flower-vase-013','flower-vase-016'], b3:['twisted-pendant','chain-pendant-03','konio-lamp','table-lamp-025','pendant-lamp-007','flower-vase-013','pendant-lamp-008','flower-vase-016','planter-pot-005','planter-pot-014'] };
const COLMAP = { warm:['twisted-pendant','chain-pendant-03','pendant-lamp-007','flower-vase-016','planter-pot-014'], white:['table-lamp-025','konio-lamp','pendant-lamp-008','flower-vase-013'], dark:['konio-lamp','twisted-pendant','pendant-lamp-008'], natural:['pendant-lamp-007','chain-pendant-03','flower-vase-013','planter-pot-005'] };
function aUnit(id){ return PRODUCTS[id].sale || PRODUCTS[id].price; }
function openAssist(){
  aAns = {};
  $('#aLog').innerHTML = '';
  $('#aOpts').innerHTML = '';
  $('#assistModal').classList.add('show');
  $('#overlay').classList.add('show');
  lockScroll();
  
  $('#cart').classList.remove('open');
  aAsk();
}
function closeAssist(){
  $('#assistModal').classList.remove('show');
  if(!$('#modal').classList.contains('show')) $('#overlay').classList.remove('show');
  if(!['#modal','#orderModal','#colorModal','#assistModal','#cstModal','#policyPage','#faqPage'].some(s=>$(s).classList.contains('show'))) unlockScroll();
}
function aMsg(who, html){
  const log = $('#aLog');
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function aOpts(rows){
  $('#aOpts').innerHTML = rows.map(r =>
    (r[0] === 'nav'
      ? `<button class="a-opt" onclick="aNav('${r[1]}','${r[2]}')">${r[2]}</button>`
      : `<button class="a-opt" onclick="aPick('${r[0]}','${r[1]}','${r[2]}')">${r[2]}</button>`)).join('');
}
function aNav(k, label){
  $('#aOpts').innerHTML = '';
  aMsg('u', label);
  if(k === 'lamps'){ aAns.cat = 'lamp'; delete aAns.place; setTimeout(aAsk, 700); return; }
  if(k === 'cheaper'){ aAns.cat = 'any'; setTimeout(aAsk, 700); return; }
  aAns.force = true;
  setTimeout(aResults, 850);
}
function aPick(field, k, label){
  $('#aOpts').innerHTML = '';
  aMsg('u', label);
  aAns[field] = k;
  const say = T()['aSay' + k.charAt(0).toUpperCase() + k.slice(1)];
  if(say){ aMsg('a', say); setTimeout(aAsk, 750); }
  else setTimeout(aAsk, 380);
}
function aAgain(){
  aAns = {};
  $('#aLog').innerHTML = '';
  $('#aOpts').innerHTML = '';
  aAsk();
}
function aAsk(){
  const t = T();
  if(!aAns.cat){
    aMsg('a', t.aIntro + '<br><b>' + t.aQ1 + '</b>');
    aOpts([['cat','lamp',t.aLamp],['cat','vase',t.aVase],['cat','plant',t.aPlant],['cat','any',t.aAny]]);
    return;
  }
  if(aAns.cat === 'lamp' && !aAns.place){
    aMsg('a', t.aQ2);
    aOpts([['place','desk',t.aDesk],['place','hang',t.aHang]]);
    return;
  }
  if(!aAns.col){
    aMsg('a', t.aQ3);
    aOpts([['col','warm',t.aWarm],['col','white',t.aWhite],['col','dark',t.aDark],['col','natural',t.aNatural]]);
    return;
  }
  if(!aAns.bud){
    aMsg('a', t.aQ4);
    aOpts([['bud','b1',t.aB1],['bud','b2',t.aB2],['bud','b3',t.aB3]]);
    return;
  }
  aMsg('a', t.aThinking);
  setTimeout(aResults, 850);
}
function aPool(a){
  const pools = { lamp:['table-lamp-025','konio-lamp','pendant-lamp-007','pendant-lamp-008','chain-pendant-03','twisted-pendant'], vase:['flower-vase-013','flower-vase-016'], plant:['planter-pot-005','planter-pot-014'], any:Object.keys(PRODUCTS) };
  let pool = pools[a.cat] || Object.keys(PRODUCTS);
  if(a.cat === 'lamp' && a.place === 'desk') pool = ['table-lamp-025','konio-lamp'];
  if(a.cat === 'lamp' && a.place === 'hang') pool = ['pendant-lamp-007','pendant-lamp-008','chain-pendant-03','twisted-pendant'];
  return pool;
}
function aChoose(a){
  return aPool(a).map(id => {
    const colOk = COLMAP[a.col].indexOf(id) > -1;
    const budOk = BUDMAP[a.bud].indexOf(id) > -1;
    return { id: id, colOk: colOk, budOk: budOk, sc: (colOk ? 2 : 0) + (budOk ? 2 : 0), u: aUnit(id) };
  }).sort((x, y) => y.sc - x.sc || Math.abs(x.u - BUD_MID[a.bud]) - Math.abs(y.u - BUD_MID[a.bud]));
}
function aResults(){
  if(!aAns.cat || !aAns.bud) return;
  const t = T();
  const pool = aPool(aAns);
  const top = BUD_TOP[aAns.bud];
  const ps = pool.map(aUnit);
  const minP = Math.min.apply(null, ps);
  const maxP = Math.max.apply(null, ps);
  const inBud = pool.some(id => BUDMAP[aAns.bud].indexOf(id) > -1);
  const catR = t['aCatR' + aAns.cat.charAt(0).toUpperCase() + aAns.cat.slice(1)];
  if(!aAns.force && !inBud && maxP < top){
    const best = pool.map(id => ({ id: id, u: aUnit(id) })).sort((x, y) => y.u - x.u)[0];
    const lampMax = Math.max.apply(null, aPool({ cat: 'lamp' }).map(aUnit));
    aMsg('a', t.aCatCheaper(catR, LE(maxP), P(best.id).name.en, LE(lampMax)));
    aOpts([['nav','lamps',t.aOptLamps],['nav','stay',t.aOptStay]]);
    return;
  }
  if(!aAns.force && !inBud && minP > top){
    const altPool = aPool({ cat: 'vase' }).concat(aPool({ cat: 'plant' }));
    const altPs = altPool.map(aUnit);
    aMsg('a', t.aCatPricier(catR, LE(minP), LE(Math.min.apply(null, altPs)) + '\u2013' + LE(Math.max.apply(null, altPs))));
    aOpts([['nav','cheaper',t.aOptCheaper],['nav','keep',t.aOptKeep]]);
    return;
  }
  const all = aChoose(aAns);
  let items = all.filter(r => r.sc >= 2).slice(0, 3);
  if(items.length === 0) items = all.slice(0, 3);
  aMsg('a', t.aPick);
  const wrap = document.createElement('div');
  wrap.className = 'a-res';
  wrap.innerHTML = items.map(r => {
    const p = PRODUCTS[r.id];
    const sug = SUGCOL[aAns.col][r.id];
    const price = p.sale ? `<b>${LE(p.sale)}</b><s>${LE(p.price)}</s>` : `<b>${LE(p.price)}</b>`;
    const reason = r.colOk && r.budOk ? t.aReasonBoth : (r.colOk ? t.aReasonColor : (r.budOk ? t.aReasonBudget : t.aReasonClose));
    return `<div class="a-item"><img data-pid="${r.id}" src="${pMain(r.id)}" alt="${p.name.en}" onerror="imgFall(this)">
      <div class="a-it"><span>${p.name.en}</span>
        <span class="a-reason">${reason}</span>
        <span class="a-col"><i style="background:${FIL[sug]}"></i>${t.aCol}: ${cname(sug)} <em class="ltr">${FIL[sug]}</em></span>
        <span class="a-pr">${price}</span></div>
      <div class="a-itb"><button class="a-view" onclick="aView('${r.id}')">${t.aView}</button>
      <button class="a-addb" onclick="aAddCart('${r.id}')">${t.aAdd}</button></div></div>`;
  }).join('');
  const log = $('#aLog');
  log.appendChild(wrap);
  aMsg('a', t.aHint);
  aOpts([['nav','again',t.aAgain]]);
  $('#aOpts .a-opt').onclick = aAgain;
  log.scrollTop = log.scrollHeight;
}
function aView(id){ selColor[id] = SUGCOL[aAns.col][id]; closeAssist(); quickOpen(id); }
function aAddCart(id){ selColor[id] = SUGCOL[aAns.col][id]; addToCart(id); closeAssist(); openCart(); }

  const p = P(currentColorFor);

        <span class="f-nm">${cname(n)}</span>

function backFromColor(){
  const qvOpen = $('#modal').classList.contains('show');
  $('#colorModal').classList.remove('show');
  if(!qvOpen) $('#overlay').classList.remove('show');
  colorOpenedOver = null;
  if(!['#modal','#orderModal','#colorModal','#assistModal','#cstModal','#policyPage','#faqPage'].some(s=>$(s).classList.contains('show'))) unlockScroll();
}
function selectFil(n){
  selColor[currentColorFor] = n;
  const wasQuick = $('#modal').classList.contains('show') && currentModal ? currentModal.id : null;
  closeAll();
  renderAll();
  if(wasQuick) quickOpen(wasQuick);

}

/* ================== CART ================== */
function addToCart(id){
  const key = id + '|' + colorOf(id);
  cart[key] = cart[key] ? cart[key] + 1 : 1;
  saveCart(); renderCart();
  toast(T().added(pname(id)));
}
function changeQty(key,d){ cart[key]=(cart[key]||0)+d; if(cart[key]<=0) delete cart[key]; saveCart(); renderCart(); }
function removeItem(key){ delete cart[key]; saveCart(); renderCart(); }
function clearCart(){ cart={}; saveCart(); renderCart(); }
function askClearCart(){ if(!cartCount()) return; $('#cartConfirm').classList.add('show'); }
function cancelClearCart(){ $('#cartConfirm').classList.remove('show'); }
function doClearCart(){ clearCart(); $('#cartConfirm').classList.remove('show'); }
function viewCartFromModal(){ closeAll(); openCart(); }
function cartItems(){
  return Object.entries(cart).map(([key,qty])=>{
    const i = key.indexOf('|');
    const id = key.slice(0,i);
    let cname = key.slice(i+1);
    const p = P(id);
    if(!p) return null;
    if(!FIL[cname]) cname = p.defColor;
    return { key, p, id, color: cname, hex: FIL[cname] || '', qty, unit: p.sale || p.price };
  }).filter(Boolean);
}
function cartTotal(){ return cartItems().reduce((s,i)=>s+i.unit*i.qty,0); }
function cartCount(){ return cartItems().reduce((s,i)=>s+i.qty,0); }

function viewFromCart(key, color){
  selColor[key] = color;
  $('#cart').classList.remove('open');
  quickOpen(key);
}
function renderCart(){
  const items = cartItems(); const n = cartCount();
  const badge = $('#cartCount');
  badge.textContent = n; badge.classList.toggle('show', n>0);
  $('#cartTitleCount').textContent = n ? `(${n})` : '';
  const body = $('#cartBody'), foot = $('#cartFoot');
  if(!items.length){
    body.innerHTML = `<div class="cart-empty">
      <svg viewBox="0 0 24 24"><path d="M6 7h12l1.5 13a1 1 0 0 1-1 1.1H5.5a1 1 0 0 1-1-1.1L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
      <p>${T().cartEmpty}</p></div>`;
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = items.map(i=>`
    <div class="c-item">
      <img data-pid="${i.id}" src="${pMain(i.id)}" alt="${i.p.name[lang]}" onerror="imgFall(this)" onclick="viewFromCart('${i.id}','${i.color}')" style="cursor:pointer">
      <div>
        <h5>${i.p.name[lang]}</h5>
        <div class="c-variant">${T().filLbl}: ${cname(i.color)} <span class="ltr">(${i.hex})</span></div>
        <div class="qty">
          <button onclick="changeQty('${i.key}',-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty('${i.key}',1)">+</button>
        </div>
      </div>
      <div>
        <div class="c-price">${LE(i.unit*i.qty)}</div>
        <button class="c-rm" onclick="removeItem('${i.key}')">${lang==='ar'?'إزالة':'Remove'}</button>
      </div>
    </div>`).join('');
  foot.innerHTML = `
    <div class="row"><span>${T().subtotal}</span><span>${LE(cartTotal())}</span></div>
    <div class="row"><span>${T().shipping}</span><span style="color:var(--olive);font-weight:600">${T().free}</span></div>
    <div class="row total"><span>${T().total}</span><span>${LE(cartTotal())}</span></div>
    <button class="wa-btn" type="button" onclick="startOrder()">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.1c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-2.9-1.3-4.8-4.2-5-4.4-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.5.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1.1 2.2 1.4 2.5 1.5.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2.1 1c.3.2.5.3.6.4.1.2.1.7-.1 1.4z"/></svg>
      ${T().checkoutWa}
    </button>
    <button class="clear-cart" onclick="askClearCart()"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg> ${T().clear}</button>`;
}

/* ================== ORDER FLOW (details -> WhatsApp) ================== */
function restoreCustomer(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem('ray-customer') || 'null'); }catch(e){}
  if(!d) return;
  if(d.name) $('#oName').value = d.name;
  if(d.addr) $('#oAddr').value = d.addr;
  if(d.phone) $('#oPhone').value = d.phone;
  if(d.alt) $('#oAlt').value = d.alt;
  if(d.gov != null && EGYPT[d.gov]){
    $('#oGov').value = String(d.gov);
    fillCities(d.gov);
    if(d.city){
      const sel = $('#oCity');
      if(d.city === 'other'){
        sel.value = 'other';
        $('#oOtherCity').classList.remove('hidden');
        if(d.cityOther) $('#oOtherCity').value = d.cityOther;
      } else {
        for(const opt of Array.from(sel.options)){ if(opt.value === String(d.city)){ sel.value = opt.value; break; } }
      }
    }
  }
}
function startOrder(items){
  orderItems = (items && items.length) ? items : cartItems();
  if(!orderItems.length){ toast(T().orderEmpty); return; }
  renderOrderItems();
  ['oName','oOtherCity','oAddr','oPhone','oAlt'].forEach(id=>{ $('#'+id).value = ''; });
  $('#oOtherCity').classList.add('hidden');
  fillGovs();
  fillCities(-1);
  restoreCustomer();
  $('#cart').classList.remove('open');
  $('#modal').classList.remove('show');
  $('#colorModal').classList.remove('show');
  $('#orderModal').classList.add('show');
  $('#overlay').classList.add('show');
  lockScroll();
  
}
function orderFromModal(){
  if(!currentModal) return;
  addToCart(currentModal.id);
  startOrder();
}
function renderOrderItems(){
  const t = T();
  $('#oItems').innerHTML =
    orderItems.map(i=>`<div class="o-line"><span>${i.qty} × ${i.p.name[lang]} <span class="ltr">(${cname(i.color)} ${i.hex})</span></span><b>${LE(i.unit*i.qty)}</b></div>`).join('') +
    `<div class="o-line total"><span>${t.total}</span><b>${LE(orderItems.reduce((s,i)=>s+i.unit*i.qty,0))}</b></div>`;
}
function fillGovs(){
  const t = T();
  $('#oGov').innerHTML = `<option value="">${t.govPh}</option>` +
    EGYPT.map((g,i)=>`<option value="${i}">${lang==='ar'?g.ar:g.en}</option>`).join('');
}
function onGovChange(){ fillCities(govIndex()); }
function fillCities(gi){
  const t = T();
  const sel = $('#oCity');
  if(isNaN(gi) || gi < 0 || !EGYPT[gi]){ sel.innerHTML = `<option value="">${t.cityPh}</option>`; return; }
  sel.innerHTML = `<option value="">${t.cityPh}</option>` +
    EGYPT[gi].c.map((c,i)=>`<option value="${i}">${lang==='ar'?c[1]:c[0]}</option>`).join('') +
    `<option value="other">${t.cityOther}</option>`;
}
function onCityChange(){
  $('#oOtherCity').classList.toggle('hidden', $('#oCity').value !== 'other');
}
async function submitOrder(e){
  e.preventDefault();
  const t = T();
  const name = $('#oName').value.trim();
  const gi = govIndex();
  const ci = $('#oCity').value;
  let city = '';
  if(ci === 'other') city = $('#oOtherCity').value.trim();
  else if(ci !== '' && gi >= 0 && EGYPT[gi] && EGYPT[gi].c[parseInt(ci,10)]) city = (lang==='ar' ? EGYPT[gi].c[parseInt(ci,10)][1] : EGYPT[gi].c[parseInt(ci,10)][0]);
  const addr = $('#oAddr').value.trim();
  const phone = $('#oPhone').value.trim();
  const alt = $('#oAlt').value.trim();
  if(!name || isNaN(gi) || gi < 0 || !city || !addr || !phone){ toast(t.errReq); return false; }
  if(!/^[0-9+\s\-]{8,15}$/.test(phone)){ toast(t.errPhone); return false; }
  if(alt && !/^[0-9+\s\-]{8,15}$/.test(alt)){ toast(t.errPhone); return false; }
  try{ localStorage.setItem('ray-customer', JSON.stringify({name:name, gov:gi, city:ci, cityOther:(ci==='other'?city:''), addr:addr, phone:phone, alt:alt})); }catch(e){}
  const total = orderItems.reduce((s,i)=>s+i.unit*i.qty,0);
  const orderNo = 'RHD-' + Math.floor(1000 + Math.random()*9000);
  let msg = `${t.waHead}\n${t.waNo} ${orderNo}\n\n${t.waItems}\n`;
  orderItems.forEach((i,n)=>{
    msg += `${n+1}. ${i.p.name[lang]}\n   • ${t.waColor}: ${i.color} (${i.hex})\n   • ${t.waQty}: ${i.qty} × ${LE(i.unit)} = ${LE(i.unit*i.qty)}\n`;
  });
  msg += `\n*${t.waTotal}: ${LE(total)}*\n\n${t.waDelivery}\n`;
  msg += `${t.waName}: ${name}\n${t.waGov}: ${lang==='ar'?EGYPT[gi].ar:EGYPT[gi].en}\n${t.waCity}: ${city}\n${t.waAddr}: ${addr}\n${t.waPhone}: ${phone}`;
  if(alt) msg += `\n${t.waAlt}: ${alt}`;
  let files = [];
  try {
    const sent = {};
    for (const i of orderItems) {
      if (sent[i.p.id]) continue;
      sent[i.p.id] = 1;
      const f = await smallImgFile(i.p.img, i.p.id);
      if (f) files.push(f);
    }
  } catch (e) {}
  waShare(msg, files);
  closeAll();
  toast(t.orderOpened);
  return false;
}

  $('#assistModal').classList.remove('show');

function quickOpen(id){
  const p = P(id);
  currentModal = { id };
  $('#mImg').alt = p.name[lang];
  mIdx = 0;
  mGallery(id);
  $('#mName').textContent = p.name[lang];
  $('#mPrice').innerHTML = priceHtml(p);

}
$('#mAdd').addEventListener('click', ()=>{

});

let mIdx = 0;
function mGallery(id){
  const p = P(id);
  const list = pImgs(id);
  const n = list.length;
  mIdx = Math.min(Math.max(0, mIdx), n - 1);
  const mimg = $('#mImg');
  mimg.dataset.pid = id;
  mimg.src = list[mIdx];
  mimg.onerror = function(){ imgFall(mimg); };
  mimg.classList.remove('m-anim');
  void mimg.offsetWidth;
  mimg.classList.add('m-anim');
  const many = n > 1;
  $('#mPrev').style.display = many ? 'flex' : 'none';
  $('#mNext').style.display = many ? 'flex' : 'none';
  $('#mCount').style.display = many ? 'block' : 'none';
  $('#mCount').textContent = (mIdx + 1) + ' / ' + n;
  const ths = $('#mThumbs');
  if (many) {
    ths.innerHTML = list.map((src,i) => `<button class="m-th${i===mIdx?' on':''}" type="button" onclick="mThumb('${id}',${i})"><img data-pid="${id}" src="${src}" onerror="imgFall(this)" alt=""></button>`).join('');
    ths.style.display = 'flex';
    const onEl = ths.querySelector('.m-th.on');
    if (onEl && typeof onEl.scrollIntoView === 'function') { try { onEl.scrollIntoView({ inline:'center', block:'nearest' }); } catch(e) {} }
  } else { ths.innerHTML = ''; ths.style.display = 'none'; }
}
function mThumb(id, i){ mIdx = i; mGallery(id); }
function mNav(d){
  const id = currentModal && currentModal.id;
  if (!id) return;
  const n = pImgs(id).length;
  if (n < 2) return;
  mIdx = (mIdx + d + n) % n;
  mGallery(id);
}
document.addEventListener('keydown', e => {
  if (!$('#modal').classList.contains('show') || !currentModal) return;
  if (e.key === 'ArrowLeft') mNav(-1);
  if (e.key === 'ArrowRight') mNav(1);
});

/* ================== SHIPPING WINDOW ================== */
function shipInfo(){
  const now = new Date();
  const addD = n => { const x = new Date(now); x.setDate(now.getDate()+n); return x; };
  const f2 = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  const f3 = d => f2(d) + '/' + d.getFullYear();
  const d1=addD(1), d2=addD(2), d3=addD(3), d7=addD(7);
  const line = T().shipLine.replace('{cd}', '<b class="cd">--:--:--</b>').replace('{d3}', f3(d3)).replace('{d7}', f3(d7));
  const st = T().shipSteps;
  return `<div class="ship-head">
      <span class="ship-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="ship-text">${line}</span>
    </div>
  <div class="ship-tl">
    <div class="tl-step"><i></i><b>${f2(now)}</b><span>${st[0]}</span></div>
    <div class="tl-line"></div>
    <div class="tl-step"><i></i><b>${f2(d1)} – ${f2(d2)}</b><span>${st[1]}</span></div>
    <div class="tl-line"></div>
    <div class="tl-step"><i></i><b>${f2(d3)} – ${f2(d7)}</b><span>${st[2]}</span></div>
  </div>`;
}
function renderShip(){
  const html = shipInfo();
  document.querySelectorAll('[data-ship]').forEach(el => el.innerHTML = html);
  shipTick();
}
function shipTick(){
  const now = new Date();
  const end = new Date(now); end.setHours(24,0,0,0);
  const diff = Math.max(0, (end - now) / 1000);
  const hh = String(Math.floor(diff/3600)).padStart(2,'0');
  const mm = String(Math.floor(diff%3600/60)).padStart(2,'0');
  const ss = String(Math.floor(diff%60)).padStart(2,'0');
  document.querySelectorAll('.cd').forEach(el => el.textContent = hh+':'+mm+':'+ss);
}
let _shipDay = new Date().toDateString();
setInterval(()=>{
  shipTick();
  const n = new Date();
  if (n.toDateString() !== _shipDay) { _shipDay = n.toDateString(); renderShip(); }
}, 1000);

}

window.addEventListener('scroll', ()=>{

  const max = h.scrollHeight - window.innerHeight;
  $('#progress').style.width = (max>0 ? (window.scrollY/max)*100 : 0) + '%';

  const hero = $('#heroImg');

const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.12, rootMargin:'0px 0px -40px 0px'});
function revealObserve(root){
  if(reduced){ (root||document).querySelectorAll('.reveal').forEach(el=>el.classList.add('in')); return; }
  (root||document).querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
}

/* ================== LANGUAGE ================== */
function buildAnnounce(){
  const s = T().announce;
  const copy = `<span>${s}  &nbsp; ${s}  &nbsp; ${s}  &nbsp; </span>`;
  $('#announceTrack').innerHTML = copy + copy;
}
function applyLang(l){
  lang = l;
  try{ localStorage.setItem('ray-lang', l); }catch(e){}
  const h = document.documentElement;
  h.lang = l==='ar' ? 'ar' : 'en';
  h.dir  = l==='ar' ? 'rtl' : 'ltr';
  document.title = T().docTitle;
  const md = document.querySelector('meta[name="description"]');
  if(md) md.content = T().metaDesc;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = T()[el.dataset.i18n];
    if(v==null) return;
    el.textContent = typeof v==='function' ? '' : v;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const v = T()[el.dataset.i18nHtml];
    if(v!=null) el.innerHTML = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const v = T()[el.dataset.i18nPh];
    if(v!=null) el.placeholder = v;
  });

  setLangBtn();
  buildAnnounce();
  renderAll();
  if($('#modal').classList.contains('show') && currentModal) quickOpen(currentModal.id);
  if($('#colorModal').classList.contains('show') && currentColorFor) renderFilGrid();
  if(document.getElementById('policyPage') && document.getElementById('policyPage').classList.contains('show')) renderPolicy();
  if(document.getElementById('faqPage') && document.getElementById('faqPage').classList.contains('show')) renderFaq();
  if($('#orderModal').classList.contains('show')){
    const gov = $('#oGov').value;
    const cityPrev = $('#oCity').value;
    fillGovs();
    const gi = (gov === '' || gov === null) ? -1 : parseInt(gov,10);
    fillCities(gi);
    if(gov !== '' && gov !== null && cityPrev !== ''){
      $('#oCity').value = cityPrev;
      onCityChange();
    }
  }
}

function setLangBtn(){

}
$('#langToggle').addEventListener('click', ()=>{
  const next = lang==='en' ? 'ar' : 'en';

  setLangBtn();
  toast(next==='ar' ? 'تم التبديل إلى العربية' : 'Switched to English');
