<style>
:root{
  --cream:#FAF7F1; --cream-2:#F4EEE3; --paper:#FFFFFF;
  --ink:#211D18; --ink-soft:#6F675B; --ink-faint:#9A938A;
  --line:#E7DFD0; --line-soft:#F0E9DC;
  --terra:#BC5B33; --terra-soft:#D08655; --olive:#7A814F;
  --dark:#241D16; --dark-2:#2E261D;
  --gold:#C09300;
  --serif:'Cormorant Garamond','Georgia',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 4px 14px rgba(60,48,32,.08);
  --shadow:0 18px 46px rgba(60,48,32,.14);
  --shadow-lg:0 30px 70px rgba(36,29,22,.22);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
html[dir="rtl"]{
  --serif:'El Messiri','Cairo',serif;
  --sans:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
section[id]{scroll-margin-top:118px}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.65;transition:background-color 2s ease;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
img{display:block;max-width:100%}
button{font-family:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}
.container{max-width:1240px;margin:0 auto;padding:0 24px}

/* ---------- progress + announcement ---------- */
.ann{background:var(--dark);color:#EDE4D6;font-size:.7rem;letter-spacing:.05em;overflow:hidden;white-space:nowrap;text-align:center}
.ann-track{display:inline-flex;white-space:nowrap;padding:9px 0}
.ann-track b{color:#F2D8C4}
.top-stack{position:sticky;top:0;z-index:100}
/* v5.33: زرار السحر داخل قسم Magic Gallery */
.mg-trigger{display:flex;align-items:center;justify-content:center;gap:13px;margin:4px 0 32px;flex-wrap:wrap}
.mb-pair{display:flex;align-items:center;gap:13px;flex:none}
.magic-btn{flex:none;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--terra);background:var(--paper);color:var(--terra);display:grid;place-items:center;cursor:pointer;transition:background 1.4s ease,color 1.4s ease,box-shadow 1.4s ease,border-color 1.4s ease,transform .25s ease}
.magic-btn:hover{transform:scale(1.07) rotate(-6deg)}
.magic-btn:active{transform:scale(.95)}
.magic-btn .mb-ico{width:26px;height:26px;fill:transparent;transition:fill 1.4s ease,filter 1.4s ease}
.magic-btn.pulse{animation:mgPulse 1.7s ease-in-out infinite}
@keyframes mbBounce{0%,100%{transform:translateY(0)}28%{transform:translateY(-9px)}52%{transform:translateY(0)}68%{transform:translateY(-4px)}84%{transform:translateY(0)}}
html:not(.lights-on) .magic-btn.bounce{animation:mgPulse 1.7s ease-in-out infinite,mbBounce 1.7s ease-in-out infinite}
@keyframes mgPulse{0%,100%{box-shadow:0 0 0 0 rgba(194,91,51,.45)}55%{box-shadow:0 0 0 15px rgba(194,91,51,0)}}
.mb-arrow{flex:none;width:84px;height:38px;color:var(--terra);opacity:.9}
.mb-txt{font-family:'Kalam','Aref Ruqaa','Cairo',cursive;font-size:1.22rem;font-weight:700;color:var(--terra);transform:rotate(-1.5deg);line-height:1.2;white-space:nowrap}
html[dir="rtl"] .mb-txt{font-size:1.32rem;transform:rotate(1.5deg)}
html[dir="rtl"] .mb-arrow{transform:scaleX(-1)}
html.lights-on .mb-txt,html.lights-on .mb-arrow{color:#B98655}
html.lights-on .magic-btn{background:radial-gradient(circle at 50% 40%,#FFE9BE 0%,#F0B268 55%,#C25B33 100%);border-color:transparent;color:#FFF6E3;box-shadow:0 0 30px rgba(233,166,91,.6),0 0 80px rgba(233,166,91,.3)}
html.lights-on .magic-btn .mb-ico{fill:#FFEFC9;filter:drop-shadow(0 0 6px rgba(255,230,170,.95))}
.mg-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
@media (max-width:720px){.mg-grid{grid-template-columns:repeat(2,1fr);gap:10px}.mb-arrow{width:52px;height:26px}.mb-txt{font-size:1.02rem}html[dir="rtl"] .mb-txt{font-size:1.12rem}.mg-trigger{flex-direction:column;gap:6px}.mb-pair{gap:9px}}
.mg-tile{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:14px;background:var(--cream-2);cursor:pointer;transition:transform .3s ease,box-shadow 2s ease}
.mg-tile:hover{transform:translateY(-4px)}
.mg-tile img{width:100%;height:100%;object-fit:cover;display:block}
html.lights-on .mg-tile{box-shadow:0 10px 34px rgba(238,178,88,.42)}
.mg-nm{position:absolute;inset-inline:0;bottom:0;padding:26px 8px 9px;background:linear-gradient(transparent,rgba(22,16,10,.74));color:#fff;font-size:.64rem;font-weight:700;text-align:center;letter-spacing:.02em;pointer-events:none}
/* v5.42: على الموبايل التايل أطول و أعرض و الاسم مش لازق في المنتج */
@media (max-width:720px){.mg-tile{aspect-ratio:3/4.6}.mg-nm{padding:36px 10px 10px}}
html[dir="rtl"] .mb-arrow{transform:scaleX(-1)}
html.lights-on{--cream:#F6EDDD;--cream-2:#F2E5CF;--paper:#FFF6E8}
html.lights-on header.nav{background:rgba(246,237,221,.93)}

/* ---------- header ---------- */
header.nav{position:relative;background:rgba(250,247,241,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s,background .3s}
header.nav.scrolled{border-color:var(--line);box-shadow:0 6px 24px rgba(60,48,32,.07)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:78px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.logo-emblem{width:48px;height:48px;border-radius:50%;flex:none}
.l-stack{display:flex;flex-direction:column;line-height:1.02}
.l1{font-family:'Poppins',var(--sans);font-size:1.5rem;font-weight:600;letter-spacing:.02em;line-height:1}
.l2{font-size:.42rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}
nav ul{display:flex;gap:26px;list-style:none}
nav a{text-decoration:none;color:var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.02em;position:relative;transition:color .2s;padding:6px 0}
nav a::after{content:'';position:absolute;inset-inline-start:0;bottom:0;width:0;height:2px;background:var(--terra);transition:width .25s}
nav a:hover{color:var(--terra)}
nav a:hover::after{width:100%}
.nav-icons{display:flex;align-items:center;gap:10px}
.light-toggle.active{color:#C97A1E;border-color:#E8B968;background:linear-gradient(160deg,#FFF6E0,#FCE9C4);box-shadow:0 0 16px rgba(238,180,86,.45)}
.light-toggle{transition:color .3s,background .3s,box-shadow .3s,border-color .3s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1250px 560px at 50% -120px,rgba(66,46,28,.30),rgba(26,18,12,.38) 78%);opacity:0;transition:opacity 2.2s ease;pointer-events:none;z-index:-1}
html.lights-on body::before{opacity:1}
html.lights-on .card .thumb{box-shadow:0 8px 30px rgba(238,178,88,.38)}
.card .thumb{transition:box-shadow 2s ease}
.thumb img.lit-layer,.m-slide img.lit-layer,.c-img img.lit-layer,.a-img img.lit-layer,.m-th img.lit-layer,.mg-tile img.lit-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.9s ease,transform 1.9s cubic-bezier(.22,.8,.3,1);pointer-events:none}
html.lights-on img.lit-layer{opacity:1}
.m-th{position:relative}
.m-th img.lit-layer{inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);border-radius:8px}

<script>

/* ================== CONFIG ================== */
const WHATSAPP = '201107942922'; // Ray Home Accessories — WhatsApp order line
async function smallImgFile(dataUri, id, maxDim){
  maxDim = maxDim || 560;
  try {
    const im = await new Promise((res, rej) => { const x = new Image(); x.onload = () => res(x); x.onerror = rej; x.src = dataUri; });
    const s = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(im, 0, 0, w, h);
    return await new Promise(res => cv.toBlob(b => res(b ? new File([b], id + '.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', 0.8));
  } catch (e) { return null; }
}
function waShare(msg){
  /* v5.43: فتح الواتساب على طول بالرسالة كاملة — navigator.share كان بيفتح قايمة مشاركة الموبايل وبتودي للميل */
  window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank');
}

  ['Bronze','#8C7853'],['Black','#2B2926'],['Grey','#9A958D'],['Baby Blue','#A9C9DD'],['Sky Blue','#7FB2D4'],
  ['Mint Green','#BCD6BF'],['Olive Green','#77814F'],['Light Pink','#E9C6C4'],['Canary Yellow','#F3D35F'],['Brick','#B4563C']
];

const discPct = p => Math.round((p.price - p.sale) / p.price * 100);
function priceHtml(p, withOff){
  if(p.sale) return `<span class="old">${LE(p.price)}</span><span class="now">${LE(p.sale)}</span>${withOff === false ? '' : `<span class="p-off">${T().off(discPct(p))}</span>`}`;
  return `<span class="now">${p.from ? T().from+' ' : ''}${LE(p.price)}</span>`;
}
function pickHtml(id){

  return `<div class="c-pick-row"><div class="c-dots">${FILAMENTS.map(([n,h]) =>

/* ================== ROOT FOLDER SYSTEM (v5) ================== */
/* Each product has its own folder in the site ROOT, named after the product id:
     <product-id>/01.jpg ... -NN.jpg   gallery photos (count = folder.n)
     <product-id>/main.jpg             main/card image
     <product-id>/sw/01.jpg ...        per-color swatch photos (products with sw only)
   Replace a photo  = overwrite that numbered file inside the folder (no code change).
   Add a photo      = add the next numbered file + bump folder.n for the product.
   Missing files silently fall back to the main image, so the site never breaks. */
/* v5.23: صور الألوان — sw/NN.jpg حسب ترتيب FILAMENTS (01=Bone White ... 15=Brick) */
function swIdx(n){ for (let i = 0; i < FILAMENTS.length; i++) if (FILAMENTS[i][0] === n) return i; return 0; }
function swSrc(id, n){ return id + '/sw/' + String(swIdx(n) + 1).padStart(2, '0') + '.jpg'; }
/* v5.37: لما اللون المختار يكون لون on/off، الأساس يبقى main.jpg — نفس أبعاد lit.jpg بالظبط، فالترانزيشن = اللمبة بتتنور من غير أي تكبير أو تغيير أبعاد */
function baseSrc(id){ const p = P(id); return (p.lit && p.litColor && colorOf(id) === p.litColor) ? p.img : swSrc(id, colorOf(id)); }
function pImgs(id){
  const p = PRODUCTS[id];
  if (p && p.folder){
    const out = [ baseSrc(id) ];
    for (let i = 1; i <= (p.folder.n || 8); i++) out.push(id + '/' + String(i).padStart(2, '0') + '.jpg');
    out.push(id + '/dims.jpg');
    return out;
  }
  return (p && p.imgs && p.imgs.length) ? p.imgs : [p.img];
}
function pMain(id){ return pImgs(id)[0]; }
function hasLit(id){ const p = P(id); return !!(p.lit && p.litColor && colorOf(id) === p.litColor); }
function imgFall(el){
  if (!el || el.dataset.fb) return;
  const p = P(el.dataset.pid);
  if (p && /^[a-z0-9-]+\/(main|lit|dims|sw\/\d{2}|\d{2})\.jpg$/.test(el.getAttribute('src') || '')){ el.dataset.fb = '1'; el.onerror = null; el.src = p.img; }
}
function cardHtml(id, animate){
  const p = P(id);
  const badge = p.sale ? `<span class="badge sale">${T().off(discPct(p))}</span>` : (p.badge ? `<span class="badge ${p.badge==='New'?'new':''} ${p.badge==='Set'?'set':''}">${T().badge[p.badge]}</span>` : '');
  return `<div class="card${animate ? ' reveal' : ''}">
    <div class="thumb">
      ${badge}
      <img data-pid="${id}" src="${pMain(id)}" alt="${p.name[lang]}" loading="lazy" onerror="imgFall(this)" onclick="quickOpen('${id}')">
      ${hasLit(id) ? `<img class="lit-layer" src="${p.lit}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
      <button class="quickview" onclick="quickOpen('${id}')">${T().quickView}</button>
    </div>
    <h4 dir="ltr">${p.name[lang]}</h4>
    <div class="price">${priceHtml(p, false)}</div>
    ${pickHtml(id)}
    <button class="add-btn" onclick="addToCart('${id}')">${T().quickAdd}</button>
  </div>`;
}
const sectionFirst = {};
let activeCat = 'desk';
function renderShop(){
  const ids = SECTIONS[activeCat];
  const g = $('#shopGrid');
  const first = sectionFirst[activeCat] === undefined;
  sectionFirst[activeCat] = false;
  g.innerHTML = ids.map((id,i)=>cardHtml(id, first).replace('class="card reveal"',`class="card reveal" style="--d:${(i%4)*.07}s"`)).join('') + customCardHtml(activeCat);
  $('#shopFoot').textContent = T().shopFoot(ids.length);
  if(first) revealObserve(g);
}
function setCat(key){
  if(!SECTIONS[key]) return;
  activeCat = key;
  document.querySelectorAll('#shopTabs .shop-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === key));
  renderShop();
}
function goCat(key){
  setCat(key);
  const sec = document.getElementById('shop');
  if(sec && sec.scrollIntoView) sec.scrollIntoView({ behavior:'smooth', block:'start' });
}
let newFirst = true, newPrev = 0;
function renderNew(){
  const g = $('#newGrid');
  const slice = BEST.slice(0, newShown);
  g.innerHTML = slice.map((id,i)=>cardHtml(id, newFirst || i>=newPrev).replace('class="card reveal"',`class="card reveal" style="--d:${(i%4)*.07}s"`)).join('');
  $('#newFoot').textContent = T().viewed(slice.length, BEST.length);
  $('#loadMore').style.display = (BEST.length > 4 && newShown < BEST.length) ? 'inline-flex' : 'none';
  revealObserve(g);
  newFirst = false;
  newPrev = newShown;
}
function loadMore(){
  const start = newShown;
  newShown = Math.min(newShown + 4, BEST.length);
  renderNew();
  const c = document.querySelectorAll('#newGrid .card')[start];
  if(c) c.scrollIntoView({behavior:'smooth', block:'start'});
}
const CAT_ID = { desk:'cat-deskGrid', hanging:'cat-hangGrid', vases:'cat-vasesGrid', planters:'cat-plantGrid' };

const MG_LAMPS = ['table-lamp-025','konio-lamp','pendant-lamp-007','pendant-lamp-008','chain-pendant-03','twisted-pendant'];
function renderMagicGallery(){
  const g = document.getElementById('mgGrid');
  if(!g) return;
  g.innerHTML = MG_LAMPS.map(id => {
    const p = P(id);
    return `<div class="mg-tile" onclick="mgOpen('${id}')">
      <img data-pid="${id}" src="${p.img}" alt="${p.name[lang]}" loading="lazy" onerror="imgFall(this)">
      ${p.lit ? `<img class="lit-layer" src="${p.lit}" alt="" onerror="this.style.display='none'">` : ''}
      <span class="mg-nm">${p.name[lang]}</span>
    </div>`;
  }).join('');
}
/* v5.42: لما الجاليري يظهر في الشاشة، زرار اللمبة بينطط «دوس عليا» — وبيقف أول ما نور العرض يتولع */
(function(){
  const btn = document.getElementById('magicBtn'), trig = document.querySelector('.mg-trigger');
  if(!btn || !trig || !('IntersectionObserver' in window)) return;
  new IntersectionObserver(es => { es.forEach(en => btn.classList.toggle('bounce', en.isIntersecting)); }, { threshold: .45 }).observe(trig);
})();
function mgOpen(id){ if(P(id).litColor) selColor[id] = P(id).litColor; quickOpen(id); }
function renderAll(){
  renderMagicGallery();
  renderShop();
  renderNew();
  renderSale();
  renderCart();
  renderShip();
}

/* ================== SALE SECTION (auto — every product with a sale price) ================== */
function renderSale(){
  const sec = document.getElementById('sale');
  const ids = Object.keys(PRODUCTS).filter(id => PRODUCTS[id].sale);
  if(!sec) return;
  if(!ids.length){ sec.style.display = 'none'; return; }
  sec.style.display = '';
  const g = $('#saleGrid');
  g.innerHTML = ids.map((id,i)=>cardHtml(id, true).replace('class="card reveal"',`class="card reveal" style="--d:${(i%4)*.07}s"`)).join('');
  revealObserve(g);
}

  const item = btn.parentElement;
  const was = item.classList.contains('open');
  document.querySelectorAll('#faqBody .faq-item.open').forEach(el => { el.classList.remove('open'); el.querySelector('.faq-q').setAttribute('aria-expanded','false'); });
  if(!was){ item.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
}

/* ================== v5.35 — categories peek: عند الـhover أو أول ضغطة صور عشوائية من منتجات القسم بألوانها ================== */
const CG_POOLS = {
  desk:['table-lamp-025','konio-lamp'],
  hanging:['pendant-lamp-007','pendant-lamp-008','chain-pendant-03','twisted-pendant'],
  vases:['flower-vase-013','flower-vase-016'],
  planters:['planter-pot-005','planter-pot-014']
};
document.querySelectorAll('.cg-item').forEach(item => {
  const cat = item.dataset.cat;
  const frame = item.querySelector('.cg-frame');
  const pk = [item.querySelector('.cg-pk.a'), item.querySelector('.cg-pk.b')];
  const capDot = item.querySelector('.cg-cap i');
  const capTxt = item.querySelector('.cg-cap span');
  const go = item.querySelector('.cg-go');
  let cur = 0, timer = null, byHover = false, lastKey = '';
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  let loading = false;
  /* v5.38: الصورة بتتحمل الأول وبعد ما تجهز بالظبط بيبدأ الفيد — كده مفيش جليتش ولا فلاش فاضي ولا هنج */
  function step(){
    const pool = CG_POOLS[cat]; if(!pool || !pool.length || loading) return;
    const id = rnd(pool), p = P(id);
    const n = Math.max(1, p.sw || 15);
    let col = FILAMENTS[Math.floor(Math.random() * n)][0];
    if(id + '|' + col === lastKey) col = FILAMENTS[Math.floor(Math.random() * n)][0];
    const key = id + '|' + col;
    if(key === lastKey) return;
    loading = true;
    const pre = new Image();
    pre.onload = () => {
      loading = false; lastKey = key;
      const nxt = 1 - cur;
      pk[nxt].classList.remove('show');
      pk[nxt].src = swSrc(id, col);
      requestAnimationFrame(() => requestAnimationFrame(() => pk[nxt].classList.add('show')));
      pk[cur].classList.remove('show');
      cur = nxt;
      capDot.style.background = FIL[col] || '#fff';
      capTxt.textContent = p.name[lang] + ' · ' + cname(col);
      go.innerHTML = (T().cgGo || 'Go to') + ' ' + item.querySelector('.cg-name').textContent.trim() + ' <span class="cg-arr">\u2192</span>';
    };
    pre.onerror = () => { loading = false; };
    pre.src = swSrc(id, col);
  }
  function start(hover){ if(timer) return; byHover = !!hover; item.classList.add('peeking'); step(); timer = setInterval(step, 1700); }
  function stop(){ if(byHover){ clearInterval(timer); timer = null; item.classList.remove('peeking'); } }
  frame.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse') start(true); });
  frame.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse') stop(); });
  frame.addEventListener('click', () => { if(item.classList.contains('peeking')) goCat(cat); else start(false); });
  go.addEventListener('click', e => { e.stopPropagation(); goCat(cat); });
});

(function(){
  const strip = document.getElementById('cgStrip'); if(!strip) return;
  const prev = document.getElementById('cgPrev'), next = document.getElementById('cgNext');
  const rtl = () => getComputedStyle(strip).direction === 'rtl';
  const maxS = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
  const flip = dir => strip.scrollBy({ left: (rtl() ? -1 : 1) * dir * 300, behavior: 'smooth' });
  if(prev) prev.addEventListener('click', () => flip(-1));
  if(next) next.addEventListener('click', () => flip(1));
  const upd = () => { const over = maxS() > 4; [prev, next].forEach(b => { if(b) b.style.display = over ? '' : 'none'; }); };
  upd(); addEventListener('resize', upd);
})();

function shipInfo(){

  const f2 = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  const f3 = d => f2(d) + '/' + d.getFullYear();
  const d1=addD(1), d2=addD(2), d3=addD(3), d7=addD(7);
  const line = T().shipLine.replace('{cd}', '<b class="cd">--:--:--</b>').replace('{d3}', f3(d3)).replace('{d7}', f3(d7));
  const st = T().shipSteps;
  return `<div class="ship-head">
      <span class="ship-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="ship-text">${line}</span>
    </div>
  <div class="ship-tl">
    <div class="tl-step"><i></i><b>${f2(now)}</b><span>${st[0]}</span></div>
    <div class="tl-line"></div>
    <div class="tl-step"><i></i><b>${f2(d1)} – ${f2(d2)}</b><span>${st[1]}</span></div>

function shipTick(){

  const end = new Date(now); end.setHours(24,0,0,0);
  const diff = Math.max(0, (end - now) / 1000);
  const hh = String(Math.floor(diff/3600)).padStart(2,'0');
  const mm = String(Math.floor(diff%3600/60)).padStart(2,'0');
  const ss = String(Math.floor(diff%60)).padStart(2,'0');
  document.querySelectorAll('.cd').forEach(el => el.textContent = hh+':'+mm+':'+ss);
}

/* v5.38: دايرة واحدة بتعرض لغة التبديل — علم مصر + ع وأنت في الإنجليزي، والعلم الأمريكي + En وأنت في العربي */
function setLangBtn(){
  $('#langToggle').innerHTML = lang === 'en' ? LG_EGYPT + '<b>ع</b>' : LG_USA + '<b>En</b>';
}
$('#langToggle').addEventListener('click', ()=>{
  const next = lang==='en' ? 'ar' : 'en';
  applyLang(next);
  setLangBtn();
  toast(next==='ar' ? 'تم التبديل إلى العربية' : 'Switched to English');
});

/* ================== INIT ================== */
applyLang(lang);
setLangBtn();
revealObserve(document);

</script>
